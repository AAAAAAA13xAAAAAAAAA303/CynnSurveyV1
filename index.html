<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cynn Survey</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI','Quicksand',system-ui,sans-serif; -webkit-tap-highlight-color:transparent; }
  html, body { overflow-x:hidden; }
  body {
    background: linear-gradient(145deg, #e3f2fd 0%, #ffffff 50%, #fce4ec 100%);
    min-height: 100vh; min-height: 100dvh;
    display:flex; justify-content:center; align-items:center;
    padding: 1rem;
    padding-top: max(1rem, env(safe-area-inset-top));
    padding-bottom: max(1rem, env(safe-area-inset-bottom));
    position:relative;
  }
  .floating-bg { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .float-item { position:absolute; font-size:2rem; opacity:0.18; animation: floatAround 22s ease-in-out infinite; }
  .float-item:nth-child(1){top:8%;left:5%;animation-delay:0s;}
  .float-item:nth-child(2){top:72%;left:88%;animation-delay:-4s;}
  .float-item:nth-child(3){top:18%;left:82%;animation-delay:-8s;}
  .float-item:nth-child(4){top:82%;left:8%;animation-delay:-12s;}
  .float-item:nth-child(5){top:45%;left:48%;animation-delay:-6s;}
  .float-item:nth-child(6){top:5%;left:58%;animation-delay:-10s;}
  @keyframes floatAround {
    0%,100%{transform:translateY(0) rotate(0deg) scale(1);}
    25%{transform:translateY(-28px) rotate(8deg) scale(1.08);}
    50%{transform:translateY(10px) rotate(-6deg) scale(0.94);}
    75%{transform:translateY(-18px) rotate(5deg) scale(1.04);}
  }
  .hero-figure {
    position:absolute; top: max(8px, env(safe-area-inset-top)); right: 10px;
    width: 130px; height: 130px; z-index: 20;
    border-radius: 50%; overflow: hidden; background: #fdfdfd;
    border: 4px solid white;
    box-shadow: 0 10px 25px rgba(173,216,230,0.55), 0 6px 14px rgba(255,182,193,0.5);
    animation: heroFloat 3.6s ease-in-out infinite;
  }
  .hero-figure img { width:100%; height:100%; object-fit: cover; object-position: center 45%; display:block; }
  @keyframes heroFloat { 0%,100%{transform:translateY(0) rotate(-3deg);} 50%{transform:translateY(-12px) rotate(3deg);} }

  .quiz-container {
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    width:100%; max-width:800px; border-radius: 40px;
    box-shadow: 0 20px 40px rgba(173,216,230,0.4), 0 8px 20px rgba(255,182,193,0.3);
    padding: 2rem 2rem 2.5rem; border: 4px solid white;
    position:relative; z-index:10; margin-top: 40px;
  }
  .header { display:flex; flex-direction:column; align-items:center; margin-bottom:1.8rem; text-align:center; }
  .hachi-avatar-wrap {
    width: 110px; height: 110px; margin-bottom: 14px;
    border-radius: 50%; overflow: hidden; background: #fdfdfd;
    border: 5px solid #b3e5fc;
    box-shadow: 0 8px 0 #81d4fa, 0 10px 20px rgba(255,182,193,0.55);
    animation: avatarBob 3.2s ease-in-out infinite; position: relative;
  }
  .hachi-avatar-wrap img { width:100%; height:100%; object-fit: cover; object-position: center 45%; display:block; }
  @keyframes avatarBob { 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-6px) rotate(3deg);} }

  h1 { font-size: 2.2rem; font-weight:700; color:#4a6fa5; text-shadow: 3px 3px 0 #f8bbd0; letter-spacing: 1px; margin-bottom: 8px; word-break: break-word; }
  .subhead {
    background:#f8bbd0; color:#4a4a4a; padding:0.4rem 1.5rem; border-radius:50px;
    font-weight:600; font-size:1.05rem; display:inline-block; box-shadow:0 4px 0 #f48fb1;
    animation: subheadFloat 3s ease-in-out infinite; max-width: 100%; word-break: break-word;
  }
  @keyframes subheadFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);} }

  .gate-screen {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 0.5rem 0.5rem 1rem;
    animation: gateSlideIn 0.6s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes gateSlideIn { 0%{opacity:0; transform:scale(0.9) translateY(20px);} 100%{opacity:1; transform:scale(1) translateY(0);} }

  .gate-title { font-size: 1.7rem; font-weight: 700; color: #4a6fa5; margin-bottom: 8px; text-shadow: 2px 2px 0 #f8bbd0; letter-spacing: 0.5px; }
  .gate-subtitle { font-size: 0.95rem; color: #7a9bb5; font-weight: 600; margin-bottom: 1.6rem; line-height: 1.4; padding: 0 0.5rem; }

  .gate-input-wrap { width: 100%; max-width: 380px; margin-bottom: 1rem; text-align: left; }
  .gate-label { font-size: 0.85rem; font-weight: 700; color: #4a6fa5; margin-bottom: 6px; margin-left: 14px; display: block; letter-spacing: 0.5px; }
  .gate-input {
    width: 100%; padding: 1rem 1.3rem; border-radius: 50px; border: 3px solid #b3e5fc;
    background: white; font-size: 1rem; color: #2c5777; font-weight: 600; outline: none;
    transition: all 0.2s ease; font-family: inherit;
  }
  .gate-input::placeholder { color: #a8c3d8; font-weight: 500; }
  .gate-input:focus { border-color: #f48fb1; box-shadow: 0 0 0 5px #fce4ec; transform: scale(1.02); }
  .gate-input.error { border-color: #f48fb1; background: #fff5f8; animation: gateShake 0.4s ease; }
  @keyframes gateShake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }

  .gate-error {
    font-size: 1rem; color: #e07a99; font-weight: 800; margin-bottom: 1rem;
    min-height: 1.4rem; text-align: center; letter-spacing: 0.3px;
    animation: errorPop 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes errorPop { 0%{opacity:0; transform:scale(0.8);} 60%{transform:scale(1.1);} 100%{opacity:1; transform:scale(1);} }

  .gate-btn {
    width: 100%; max-width: 380px; padding: 1.1rem 1.5rem; border-radius: 50px;
    border: 3px solid white; background: #b3e5fc; color: #1e3b5c;
    font-weight: 800; font-size: 1.1rem; cursor: pointer;
    box-shadow: 0 8px 0 #81d4fa, 0 10px 20px rgba(255,182,193,0.4);
    transition: all 0.15s ease; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 0.5rem;
  }
  .gate-btn:hover:not(:disabled) { background: #81d4fa; transform: translateY(-3px); box-shadow: 0 11px 0 #81d4fa; }
  .gate-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 5px 0 #81d4fa; }
  .gate-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .loading-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 1.5rem 1rem 2rem; text-align: center;
    animation: gateSlideIn 0.5s ease-out;
  }
  .fingerprint-wrap { position: relative; width: 180px; height: 180px; margin-bottom: 1.8rem; display: flex; align-items: center; justify-content: center; }
  .fp-ring { position: absolute; border-radius: 50%; border: 3px solid #b3e5fc; animation: fpRingPulse 2s ease-out infinite; }
  .fp-ring:nth-child(1){ width:180px; height:180px; animation-delay: 0s; }
  .fp-ring:nth-child(2){ width:150px; height:150px; animation-delay: 0.5s; border-color:#f8bbd0; }
  .fp-ring:nth-child(3){ width:120px; height:120px; animation-delay: 1s; }
  @keyframes fpRingPulse { 0%{ transform:scale(0.85); opacity:0; } 40%{ opacity:0.8; } 100%{ transform:scale(1.15); opacity:0; } }

  .fp-icon { position: relative; width: 110px; height: 110px; z-index: 2; filter: drop-shadow(0 6px 12px rgba(255,182,193,0.55)); }
  .fp-icon svg { width:100%; height:100%; display:block; }
  .fp-scanline {
    position: absolute; left: 10%; width: 80%; height: 6px;
    background: linear-gradient(90deg, transparent, #f48fb1, #f8bbd0, #f48fb1, transparent);
    border-radius: 10px; box-shadow: 0 0 18px 6px rgba(244,143,177,0.8); z-index: 3;
    animation: fpScan 2s ease-in-out infinite;
  }
  @keyframes fpScan {
    0%{ top: 15%; opacity: 0; } 10%{ opacity: 1; } 50%{ top: 85%; opacity: 1; }
    90%{ opacity: 1; } 100%{ top: 15%; opacity: 0; }
  }
  .loading-title { font-size: 1.25rem; font-weight: 700; color: #4a6fa5; margin-bottom: 8px; letter-spacing: 0.5px; }
  .loading-status { font-size: 0.95rem; color: #7a9bb5; font-weight: 600; margin-bottom: 1.6rem; min-height: 1.3rem; }

  .progress-track {
    width: 220px; height: 12px; background: #e1f5fe; border-radius: 20px; overflow: hidden;
    border: 2px solid white; box-shadow: inset 0 -2px 0 #b3e5fc; margin-bottom: 12px;
  }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #b3e5fc 0%, #f8bbd0 100%); border-radius: 20px; transition: width 0.1s linear; }
  .progress-percent { font-size: 0.9rem; font-weight: 800; color: #4a6fa5; }

  .wife-confirmed {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem 1rem 2.5rem; text-align: center;
    animation: wifePop 0.8s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes wifePop { 0%{ opacity:0; transform:scale(0.5); } 60%{ opacity:1; transform:scale(1.12); } 100%{ transform:scale(1); } }
  .wife-badge {
    width: 160px; height: 160px; border-radius: 50%;
    background: linear-gradient(145deg, #e1f5fe, #fce4ec);
    border: 6px solid white;
    box-shadow: 0 12px 0 #f8bbd0, 0 14px 28px rgba(173,216,230,0.6);
    display: flex; align-items: center; justify-content: center;
    font-size: 5rem; margin-bottom: 1.4rem;
    animation: wifeBob 2.5s ease-in-out infinite; position: relative;
    overflow: hidden;
  }
  .wife-badge img { width:100%; height:100%; object-fit: cover; object-position: center 45%; }
  @keyframes wifeBob { 0%,100%{ transform:translateY(0) rotate(-3deg); } 50%{ transform:translateY(-10px) rotate(3deg); } }
  .wife-badge::after {
    content: "✔"; position: absolute; bottom: 6px; right: 6px;
    background: #b3e5fc; color: white; font-size: 1.6rem; font-weight: 900;
    width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 4px solid white; box-shadow: 0 4px 8px rgba(129,212,250,0.6);
    z-index: 2;
  }
  .wife-title { font-size: 2rem; font-weight: 800; color: #4a6fa5; text-shadow: 3px 3px 0 #f8bbd0; letter-spacing: 1px; margin-bottom: 10px; }
  .wife-sub { font-size: 1rem; color: #7a9bb5; font-weight: 600; margin-bottom: 1rem; }
  .wife-hearts { font-size: 1.6rem; letter-spacing: 6px; animation: heartsWave 1.4s ease-in-out infinite; }
  @keyframes heartsWave { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }

  .hidden { display:none !important; }

  .status-bar {
    display:flex; justify-content:space-between; align-items:center;
    background:#e1f5fe; padding:0.75rem 1.2rem; border-radius:100px; margin-bottom:1.6rem;
    font-weight:600; color:#2c5777; border:3px solid white;
    box-shadow: inset 0 -3px 0 #b3e5fc; animation: statusSlideIn 0.5s ease-out;
    gap: 8px; flex-wrap: nowrap; font-size: 0.95rem;
  }
  @keyframes statusSlideIn { from{opacity:0; transform:translateY(-20px);} to{opacity:1; transform:translateY(0);} }
  .status-bar > span:first-child { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .question-counter { background:#f8bbd0; padding:0.2rem 0.9rem; border-radius:40px; color:#4a2e3b; font-size: 0.9rem; white-space: nowrap; flex-shrink: 0; }

  .question-text {
    background:#ffffffd9; padding:1.4rem 1.8rem; border-radius:40px; margin-bottom:1.6rem;
    font-size:1.35rem; font-weight:600; color:#2c3e50; border:3px dashed #b3e5fc;
    text-align:center; line-height:1.5; word-break:break-word;
    box-shadow:0 8px 0 #f8bbd0;
    animation: questionBounceIn 0.6s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes questionBounceIn {
    0%{opacity:0; transform:scale(0.85) translateY(25px);}
    60%{opacity:1; transform:scale(1.04) translateY(-4px);}
    100%{transform:scale(1) translateY(0);}
  }

  .choices-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:2rem; }
  .choice-btn {
    background:white; border:3px solid #b3e5fc; border-radius:50px; padding:0.95rem 1.1rem;
    font-size:1.05rem; font-weight:600; color:#2c5777; cursor:pointer;
    transition: all 0.2s ease; text-align:left; display:flex; align-items:center; gap:10px;
    box-shadow:0 6px 0 #f8bbd0; word-break:break-word;
    animation: choicePopIn 0.4s ease-out backwards;
    min-height: 60px; font-family: inherit;
  }
  .choice-btn:nth-child(1){animation-delay:0.08s;}
  .choice-btn:nth-child(2){animation-delay:0.16s;}
  .choice-btn:nth-child(3){animation-delay:0.24s;}
  .choice-btn:nth-child(4){animation-delay:0.32s;}
  @keyframes choicePopIn { from{opacity:0; transform:scale(0.9) translateY(10px);} to{opacity:1; transform:scale(1) translateY(0);} }

  .choice-btn:hover:not(:disabled) {
    background:#e1f5fe; border-color:#81d4fa; transform:translateY(-3px) scale(1.02);
    box-shadow:0 9px 0 #f48fb1, 0 0 20px rgba(255,182,193,0.4);
  }
  .choice-btn:active:not(:disabled) { transform: translateY(1px); box-shadow: 0 4px 0 #f48fb1; }
  .choice-btn.selected { background:#fce4ec; border-color:#f48fb1; box-shadow:0 0 0 3px #f8bbd0, 0 6px 0 #f48fb1; color:#4a2e3b; }
  .choice-letter {
    background:#b3e5fc; border-radius:50%; width:30px; height:30px; flex-shrink: 0;
    display:inline-flex; align-items:center; justify-content:center;
    font-weight:800; color:#2c5777; border:2px solid white;
    transition:all 0.25s ease; font-size: 0.9rem;
  }
  .choice-btn.selected .choice-letter { background:#f48fb1; color:white; transform:rotate(360deg); }

  .nav-buttons { display:flex; justify-content:space-between; gap:12px; }
  .btn {
    background:white; border:none; padding:1rem 1.2rem; border-radius:50px;
    font-weight:700; font-size:1.05rem; display:flex; align-items:center;
    justify-content:center; gap:8px; cursor:pointer; transition:all 0.15s ease;
    border:3px solid #b3e5fc; color:#2c5777; box-shadow:0 6px 0 #f8bbd0; flex:1;
    font-family: inherit; min-height: 56px; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background:#e1f5fe; transform:translateY(-3px); box-shadow:0 9px 0 #f48fb1; }
  .btn:active:not(:disabled) { transform:translateY(2px); box-shadow:0 4px 0 #f48fb1; }
  .btn:disabled { opacity:0.45; cursor:not-allowed; transform:none; box-shadow:0 3px 0 #f8bbd0; }
  .btn-primary { background:#b3e5fc; color:#1e3b5c; border-color:white; }
  .btn-primary:hover:not(:disabled) { background:#81d4fa; }

  .email-section {
    margin-top:1rem; text-align:center; background:#ffffffcc; border-radius:40px;
    padding:1.6rem 1.4rem; border:3px dashed #f8bbd0; animation: emailSlideUp 0.6s ease-out;
  }
  @keyframes emailSlideUp { from{opacity:0; transform:translateY(30px);} to{opacity:1; transform:translateY(0);} }
  .email-section p { font-size:1.1rem; margin-bottom:1.3rem; color:#2c3e50; font-weight:600; line-height: 1.4; }
  .email-input {
    width:100%; padding:1.1rem 1.3rem; border-radius:50px; border:3px solid #b3e5fc;
    font-size:1rem; outline:none; background:white; margin-bottom:1.2rem;
    color:#2c5777; font-weight:500; transition:all 0.2s ease; font-family: inherit;
  }
  .email-input:focus { border-color:#f48fb1; box-shadow:0 0 0 5px #fce4ec; transform:scale(1.02); }
  .result-message {
    margin-top:1.3rem; font-weight:700; color:#4a6fa5; font-size:1.1rem;
    background:#e1f5fe; padding:1.3rem; border-radius:30px;
    animation: resultPop 0.8s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes resultPop {
    0%{opacity:0; transform:scale(0.5) rotate(-5deg);}
    60%{opacity:1; transform:scale(1.1) rotate(2deg);}
    100%{transform:scale(1) rotate(0deg);}
  }
  .score-highlight {
    background:#f8bbd0; padding:0.3rem 1rem; border-radius:30px; color:#2c3e50;
    font-size:1.7rem; display:inline-block; margin:0.5rem 0;
    animation: scoreBounce 1.5s ease-in-out infinite;
  }
  @keyframes scoreBounce { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }

  .footer-note { font-size:0.8rem; color:#7a9bb5; text-align:center; margin-top:1rem; }
  .sparkle { position:fixed; pointer-events:none; font-size:1.4rem; animation: sparkleFly 1.5s ease-out forwards; z-index:999; }
  @keyframes sparkleFly {
    0%{opacity:1; transform:translate(0,0) scale(1) rotate(0deg);}
    100%{opacity:0; transform:translate(var(--tx),var(--ty)) scale(0) rotate(360deg);}
  }
  .paw-trail { position:fixed; pointer-events:none; font-size:1.1rem; opacity:0.6; animation: pawFade 1s ease-out forwards; z-index:9999; }
  @keyframes pawFade { 0%{opacity:0.7; transform:scale(1);} 100%{opacity:0; transform:scale(0.5);} }

  .music-toggle {
    position: fixed;
    bottom: max(16px, env(safe-area-inset-bottom));
    right: 16px;
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 3px solid white;
    background: #b3e5fc;
    color: #1e3b5c;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 0 #81d4fa, 0 8px 16px rgba(255,182,193,0.5);
    z-index: 9999;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .music-toggle:hover { background: #81d4fa; transform: translateY(-2px); box-shadow: 0 8px 0 #81d4fa; }
  .music-toggle:active { transform: translateY(2px); box-shadow: 0 4px 0 #81d4fa; }
  .music-toggle.playing {
    background: #f8bbd0;
    box-shadow: 0 6px 0 #f48fb1, 0 8px 16px rgba(255,182,193,0.6);
    animation: musicPulse 1.6s ease-in-out infinite;
  }
  @keyframes musicPulse { 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.08); } }

  @media (max-width: 820px) { .quiz-container { padding: 1.8rem; border-radius: 36px; } h1 { font-size: 2rem; } }
  @media (max-width: 480px) {
    body { padding: 0.75rem; padding-top: max(0.75rem, env(safe-area-inset-top)); padding-bottom: max(0.75rem, env(safe-area-inset-bottom)); }
    .hero-figure { width: 95px; height: 95px; top: max(6px, env(safe-area-inset-top)); right: 8px; border-width: 3px; }
    .quiz-container { padding: 1.4rem 1.2rem 2rem; border-radius: 30px; margin-top: 30px; border-width: 3px; }
    .header { margin-bottom: 1.3rem; }
    .hachi-avatar-wrap { width: 88px; height: 88px; margin-bottom: 10px; border-width: 4px; }
    h1 { font-size: 1.65rem; text-shadow: 2px 2px 0 #f8bbd0; letter-spacing: 0.5px; }
    .subhead { font-size: 0.92rem; padding: 0.35rem 1.1rem; }
    .gate-title { font-size: 1.4rem; }
    .gate-subtitle { font-size: 0.88rem; }
    .gate-input { padding: 0.9rem 1.1rem; font-size: 0.95rem; border-width: 2px; }
    .gate-btn { padding: 1rem 1.2rem; font-size: 1rem; border-width: 2px; }
    .gate-error { font-size: 0.92rem; }
    .fingerprint-wrap { width: 150px; height: 150px; }
    .fp-ring:nth-child(1){ width:150px; height:150px; }
    .fp-ring:nth-child(2){ width:125px; height:125px; }
    .fp-ring:nth-child(3){ width:100px; height:100px; }
    .fp-icon { width: 90px; height: 90px; }
    .loading-title { font-size: 1.1rem; }
    .loading-status { font-size: 0.88rem; }
    .progress-track { width: 190px; }
    .wife-badge { width: 130px; height: 130px; font-size: 4rem; }
    .wife-badge::after { width: 38px; height: 38px; font-size: 1.3rem; }
    .wife-title { font-size: 1.6rem; }
    .wife-sub { font-size: 0.9rem; }
    .status-bar { padding: 0.6rem 0.9rem; font-size: 0.82rem; margin-bottom: 1.2rem; border-width: 2px; border-radius: 50px; }
    .question-counter { font-size: 0.78rem; padding: 0.15rem 0.7rem; }
    .question-text { font-size: 1.05rem; padding: 1rem 1.1rem; border-radius: 30px; margin-bottom: 1.3rem; border-width: 2px; box-shadow: 0 6px 0 #f8bbd0; }
    .choices-grid { grid-template-columns: 1fr; gap: 0.7rem; margin-bottom: 1.5rem; }
    .choice-btn { font-size: 0.95rem; padding: 0.85rem 1rem; border-radius: 40px; border-width: 2px; min-height: 54px; box-shadow: 0 5px 0 #f8bbd0; gap: 8px; }
    .choice-letter { width: 26px; height: 26px; font-size: 0.8rem; }
    .nav-buttons { gap: 8px; }
    .btn { padding: 0.85rem 0.8rem; font-size: 0.95rem; border-radius: 40px; border-width: 2px; min-height: 52px; box-shadow: 0 5px 0 #f8bbd0; gap: 5px; }
    .email-section { padding: 1.3rem 1rem; border-radius: 30px; border-width: 2px; }
    .email-section p { font-size: 0.98rem; margin-bottom: 1rem; }
    .email-input { padding: 0.95rem 1.1rem; font-size: 0.95rem; border-radius: 40px; border-width: 2px; margin-bottom: 1rem; }
    .result-message { font-size: 0.98rem; padding: 1.1rem; border-radius: 24px; margin-top: 1rem; }
    .score-highlight { font-size: 1.5rem; padding: 0.25rem 0.9rem; }
    .footer-note { font-size: 0.72rem; margin-top: 0.8rem; }
    .music-toggle { width: 46px; height: 46px; font-size: 1rem; }
  }
  @media (max-width: 400px) {
    .hero-figure { width: 82px; height: 82px; }
    h1 { font-size: 1.5rem; }
    .hachi-avatar-wrap { width: 78px; height: 78px; }
    .question-text { font-size: 1rem; }
    .choice-btn { font-size: 0.9rem; padding: 0.8rem 0.9rem; min-height: 52px; }
    .btn { font-size: 0.9rem; padding: 0.8rem 0.7rem; }
    .status-bar { font-size: 0.78rem; }
    .question-counter { font-size: 0.72rem; }
  }
  @media (max-width: 360px) {
    body { padding: 0.5rem; }
    .hero-figure { width: 72px; height: 72px; top: 4px; right: 6px; }
    .quiz-container { padding: 1.1rem 0.9rem 1.6rem; border-radius: 24px; margin-top: 22px; }
    h1 { font-size: 1.35rem; }
    .subhead { font-size: 0.82rem; padding: 0.3rem 0.9rem; }
    .hachi-avatar-wrap { width: 68px; height: 68px; border-width: 3px; }
    .question-text { font-size: 0.92rem; padding: 0.85rem 0.9rem; }
    .choice-btn { font-size: 0.85rem; padding: 0.7rem 0.8rem; min-height: 48px; }
    .choice-letter { width: 24px; height: 24px; font-size: 0.75rem; }
    .btn { font-size: 0.82rem; padding: 0.7rem 0.6rem; min-height: 48px; }
    .status-bar { padding: 0.5rem 0.7rem; font-size: 0.72rem; }
  }
  @media (max-height: 500px) and (orientation: landscape) {
    body { align-items: flex-start; padding: 0.6rem; }
    .quiz-container { margin-top: 8px; padding: 1.2rem 1.5rem 1.5rem; }
    .hero-figure { width: 70px; height: 70px; top: 6px; right: 6px; }
    .hachi-avatar-wrap { width: 60px; height: 60px; margin-bottom: 6px; }
    h1 { font-size: 1.3rem; margin-bottom: 4px; }
    .header { margin-bottom: 1rem; }
    .question-text { padding: 0.9rem 1.2rem; font-size: 1.05rem; margin-bottom: 1rem; }
    .choices-grid { gap: 0.6rem; margin-bottom: 1rem; }
    .choice-btn { padding: 0.65rem 0.9rem; min-height: 46px; font-size: 0.9rem; }
    .btn { padding: 0.7rem 1rem; min-height: 46px; font-size: 0.9rem; }
  }
  @media (hover: none) and (pointer: coarse) {
    .choice-btn:hover:not(:disabled) { transform: none; }
    .btn:hover:not(:disabled) { transform: none; }
  }
</style>
</head>
<body>

<div class="floating-bg">
  <div class="float-item">🐾</div><div class="float-item">💙</div>
  <div class="float-item">🩷</div><div class="float-item">🐾</div>
  <div class="float-item">✨</div><div class="float-item">💕</div>
</div>

<div class="hero-figure">
  <img src="hachiware.png" alt="Hachiware">
</div>

<div class="quiz-container" id="quizApp">
  <div class="header">
    <div class="hachi-avatar-wrap">
      <img src="hachiware.png" alt="Hachiware">
    </div>
    <h1>Cynn Survey</h1>
    <div class="subhead">how well do you know me? 💙</div>
  </div>

  <!-- STAGE 1 — IDENTITY GATE -->
  <div id="gateStage" class="gate-screen">
    <div class="gate-title">🔐 Confirm Identity</div>
    <div class="gate-subtitle">Only one person can take this survey.<br>Let's make sure it's you 💙</div>

    <div class="gate-input-wrap">
      <label class="gate-label" for="gateName">YOUR NAME</label>
      <input type="text" id="gateName" class="gate-input" placeholder="Enter name" autocomplete="off" autocapitalize="words">
    </div>

    <div class="gate-input-wrap">
      <label class="gate-label" for="gateBirth">BIRTHDATE (MM/DD)</label>
      <input type="text" id="gateBirth" class="gate-input" placeholder="Enter birthdate" autocomplete="off" inputmode="numeric">
    </div>

    <div class="gate-error" id="gateError"></div>

    <button class="gate-btn" id="gateVerifyBtn" type="button">
      <i class="fas fa-fingerprint"></i> Verify & Start
    </button>
  </div>

  <!-- STAGE 2 — LOADING SCREEN -->
  <div id="loadingStage" class="loading-screen hidden">
    <div class="fingerprint-wrap">
      <div class="fp-ring"></div>
      <div class="fp-ring"></div>
      <div class="fp-ring"></div>

      <div class="fp-icon">
        <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="60" cy="78" rx="30" ry="26" fill="#b3e5fc" stroke="#81d4fa" stroke-width="2.5"/>
          <ellipse cx="32" cy="46" rx="11" ry="14" fill="#b3e5fc" stroke="#81d4fa" stroke-width="2.5"/>
          <ellipse cx="52" cy="32" rx="11" ry="15" fill="#b3e5fc" stroke="#81d4fa" stroke-width="2.5"/>
          <ellipse cx="74" cy="32" rx="11" ry="15" fill="#b3e5fc" stroke="#81d4fa" stroke-width="2.5"/>
          <ellipse cx="90" cy="46" rx="11" ry="14" fill="#b3e5fc" stroke="#81d4fa" stroke-width="2.5"/>
          <ellipse cx="60" cy="78" rx="20" ry="17" fill="none" stroke="#f8bbd0" stroke-width="2" opacity="0.85"/>
          <ellipse cx="60" cy="78" rx="11" ry="9" fill="none" stroke="#f8bbd0" stroke-width="2" opacity="0.9"/>
          <ellipse cx="60" cy="78" rx="3" ry="2.5" fill="#f48fb1"/>
        </svg>
      </div>

      <div class="fp-scanline"></div>
    </div>

    <div class="loading-title" id="loadingTitle">Verify Identity</div>
    <div class="loading-status" id="loadingStatus">Running background check...</div>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-percent" id="progressPercent">0%</div>
  </div>

  <!-- STAGE 3 — WIFE CONFIRMED -->
  <div id="wifeStage" class="wife-confirmed hidden">
    <div class="wife-badge">
      <img src="hachiware.png" alt="Hachiware">
    </div>
    <div class="wife-title">Wife Confirmed</div>
    <div class="wife-sub">Access granted, my love 💙<br>Loading the survey...</div>
    <div class="wife-hearts">💙 🩷 💙</div>
  </div>

  <!-- STAGE 4 — QUIZ -->
  <div id="quizStage" class="hidden">
    <div id="quizContent"></div>
  </div>

  <div class="footer-note" id="footerNote">for my favourite person · 30 questions</div>
</div>

<!-- Music toggle -->
<button class="music-toggle" id="musicToggle" type="button" aria-label="Toggle music">
  <i class="fas fa-music"></i>
</button>

<!-- Background music — your own song.mp3, loops forever at 70% volume -->
<audio id="bgMusic" loop preload="auto">
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
  const questions = [
    { q:"If my heart had a colour, what would it be? 💗", choices:["A cool baby blue","A soft baby pink","Pure snowy white","A gentle lavender"], correct:1 },
    { q:"Which game could I play until 3am and still say 'one more round'? 🎮", choices:["Minecraft (building my dream house)","Valorant (one more clutch pls)","Roblox (just vibing)","League of Legends (send help)"], correct:1 },
    { q:"Which sport would make me actually leave the house? 🏐", choices:["Basketball","Football","Volleyball","Badminton"], correct:2 },
    { q:"How do I feel about summer? ☀️", choices:["I love it, bring the sunshine!","It's okay I guess","I hate it, take me to winter","I don't really care"], correct:2 },
    { q:"Where do you NOT want me to take you on a date? 🪂", choices:["A rooftop cafe","A skydiving lesson (heights?!)","A cozy movie night","A quiet picnic"], correct:1 },
    { q:"How far would I go for the person I love? 💙", choices:["Only if it's convenient","I'd help sometimes","I'd sacrifice my own needs for her","I'd think about it first"], correct:2 },
    { q:"If only ONE of us could be stressed, who should it be? 😤", choices:["Her, definitely her","Me, always me","Both of us together","Neither, we cuddle instead"], correct:1 },
    { q:"Which flower makes me think of you? 🌼", choices:["A red rose","Jasmine","A sunflower","A tulip"], correct:1 },
    { q:"What's my dream job? 💻", choices:["A doctor saving lives","A cybersecurity specialist","An engineer","A teacher"], correct:1 },
    { q:"How long have I been a tech nerd? 🔧", choices:["Since last year","Since high school","Ever since I was a kid","I actually don't like tech"], correct:2 },
    { q:"How do I feel about small talk with strangers? 😐", choices:["I love chatting with everyone","I don't like talking too much","I'm super social","I talk nonstop"], correct:1 },
    { q:"What is my memory like? 🧠", choices:["Razor sharp","Pretty average","Honestly kind of bad","Photographic"], correct:2 },
    { q:"Which two foods could I eat forever and never complain? 🍜", choices:["Pizza and sushi","Ramen and spaghetti","Burgers and fries","Rice and dumplings"], correct:1 },
    { q:"What time of day makes me go 'wow, this is life'? 🌅", choices:["Sunrise (too early, no)","Sunset (pure magic)","Midnight (vibes)","3pm (naptime)"], correct:1 },
    { q:"Which food makes me run the other way? 🐟", choices:["Anything spicy","Anything sweet","Seafood, absolutely not","Anything green"], correct:2 },
    { q:"Which two snacks would make me forgive you for anything? 🧁", choices:["Chips and dip","Muffins and brownies","Popcorn and candy","Cookies and milk"], correct:1 },
    { q:"What's the fastest way to lose my trust? 🤥", choices:["Forgetting my birthday","Lying to me","Borrowing my hoodie","Eating my snacks"], correct:1 },
    { q:"If you keep secrets from me, what happens? 🤐", choices:["I'll be fine, no worries","I'll just ignore it","I'll leave — honesty is everything","I'll be a little sad"], correct:2 },
    { q:"Which supercar lives rent-free in my head? 🏎️", choices:["Ferrari 488","Lamborghini Huracán","McLaren 720S","Porsche 911"], correct:2 },
    { q:"Which bike is my absolute dream? 🏍️", choices:["BMW S1000R (2021)","BMW S1000R (2024)","BMW S1000R (2022)","BMW S1000R (2023)"], correct:3 },
    { q:"What does my 'happily ever after' look like? 💍", choices:["Being rich and alone","Living happily with the love of my life","Traveling the world solo","A big mansion with 10 cars"], correct:1 },
    { q:"Which country's vibe do I love the most? 🇰🇷", choices:["Japan","Korea","Thailand","China"], correct:1 },
    { q:"What movie genre gets my full attention? 🎬", choices:["Romance","Comedy","Action","Horror"], correct:2 },
    { q:"How do I feel about sweet things? 🍬", choices:["I could eat them all day","I love them a lot","I hate them — no thanks","Only sometimes"], correct:2 },
    { q:"What weather makes me feel calm and happy? 🌧️", choices:["Hot and sunny","Rain — I love the rain","Snowy and freezing","Windy and grey"], correct:1 },
    { q:"What would I do to make you happy? 💙", choices:["A little bit","Only if it's easy","Anything — absolutely anything","Depends on my mood"], correct:2 },
    { q:"If I had only my last money, what would I spend it on? 💸", choices:["My own food","Save it for later","On you instead of eating","Something for myself"], correct:2 },
    { q:"What toy could keep me happy for hours? 🧱", choices:["Action figures","Legos — I love building","Puzzles","Board games"], correct:1 },
    { q:"Why am I scared of a lot of things? 😔", choices:["Just born that way","Childhood trauma","Too many horror movies","I'm not scared of anything"], correct:1 },
    { q:"What is her name — the one I love the most? 💕", choices:["Luna","Chan","Jess","Jas"], correct:1 }
  ];

  let currentQuestionIndex = 0;
  let userAnswers = new Array(questions.length).fill(null);
  let quizFinished = false;

  const gateStage     = document.getElementById('gateStage');
  const loadingStage  = document.getElementById('loadingStage');
  const wifeStage     = document.getElementById('wifeStage');
  const quizStage     = document.getElementById('quizStage');
  const quizContent   = document.getElementById('quizContent');
  const footerNote    = document.getElementById('footerNote');
  const gateError     = document.getElementById('gateError');
  const gateName      = document.getElementById('gateName');
  const gateBirth     = document.getElementById('gateBirth');
  const gateVerifyBtn = document.getElementById('gateVerifyBtn');
  const progressFill  = document.getElementById('progressFill');
  const progressPercent = document.getElementById('progressPercent');
  const loadingTitle  = document.getElementById('loadingTitle');
  const loadingStatus = document.getElementById('loadingStatus');
  const bgMusic       = document.getElementById('bgMusic');
  const musicToggle   = document.getElementById('musicToggle');

  // ============================================================
  // BACKGROUND MUSIC — your song.mp3 at 70% volume, loops forever
  // ============================================================
  bgMusic.volume = 0.7;

  function playMusic() {
    bgMusic.volume = 0.7;
    const p = bgMusic.play();
    if (p && typeof p.then === 'function') {
      p.then(() => {
        musicToggle.classList.add('playing');
      }).catch(err => {
        console.warn('Autoplay blocked:', err);
        musicToggle.classList.remove('playing');
      });
    }
  }

  function toggleMusic() {
    if (bgMusic.paused) {
      playMusic();
    } else {
      bgMusic.pause();
      musicToggle.classList.remove('playing');
    }
  }
  musicToggle.addEventListener('click', toggleMusic);

  // ============================================================
  // IDENTITY GATE
  // ============================================================
  gateVerifyBtn.addEventListener('click', () => {
    const nameVal  = gateName.value.trim();
    const birthVal = gateBirth.value.trim();
    const birthNorm = birthVal.replace(/[\s\-\.\/]/g, '');
    const nameOK  = nameVal.toLowerCase() === 'chan';
    const birthOK = birthNorm === '1024';

    gateName.classList.remove('error');
    gateBirth.classList.remove('error');
    gateError.textContent = '';

    if (!nameOK || !birthOK) {
      gateName.classList.add('error');
      gateBirth.classList.add('error');
      gateError.textContent = "Who the hell are you?!?!?! 😾";
      return;
    }

    bgMusic.volume = 0.7;
    bgMusic.load();

    startLoading();
  });

  [gateName, gateBirth].forEach(inp => {
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') gateVerifyBtn.click();
    });
  });

  function startLoading() {
    gateStage.classList.add('hidden');
    loadingStage.classList.remove('hidden');
    footerNote.textContent = 'verifying identity...';

    const statuses = [
      { t: 0,     title: 'Verify Identity', msg: 'Running background check...' },
      { t: 1200,  title: 'Verify Identity', msg: 'Matching paw print 🐾' },
      { t: 2400,  title: 'Verify Identity', msg: 'Cross-checking records...' },
      { t: 3600,  title: 'Verify Identity', msg: 'Everything looks good 💙' },
      { t: 4600,  title: 'Verify Identity', msg: 'Access granted!' }
    ];

    statuses.forEach(s => {
      setTimeout(() => {
        loadingTitle.textContent = s.title;
        loadingStatus.textContent = s.msg;
      }, s.t);
    });

    const totalMs = 5000;
    const start = performance.now();

    function tick(now) {
      const elapsed = now - start;
      const pct = Math.min(100, (elapsed / totalMs) * 100);
      progressFill.style.width = pct + '%';
      progressPercent.textContent = Math.floor(pct) + '%';

      if (elapsed < totalMs) {
        requestAnimationFrame(tick);
      } else {
        loadingStage.classList.add('hidden');
        wifeStage.classList.remove('hidden');
        footerNote.textContent = 'wife confirmed 💙';

        for (let i = 0; i < 24; i++) {
          setTimeout(() => {
            const s = document.createElement('div');
            s.className = 'sparkle';
            s.textContent = ['✨','💙','🩷','⭐','🐾','💕'][Math.floor(Math.random()*6)];
            s.style.left = Math.random() * window.innerWidth + 'px';
            s.style.top  = Math.random() * window.innerHeight + 'px';
            s.style.setProperty('--tx', (Math.random()-0.5)*300 + 'px');
            s.style.setProperty('--ty', (Math.random()-0.5)*300 + 'px');
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 1500);
          }, i * 60);
        }

        setTimeout(() => {
          wifeStage.classList.add('hidden');
          quizStage.classList.remove('hidden');
          footerNote.textContent = 'for my favourite person · 30 questions';

          // 🎵 Music starts here — the moment the survey page appears
          playMusic();

          initQuiz();
        }, 2500);
      }
    }
    requestAnimationFrame(tick);
  }

  // ============================================================
  // QUIZ LOGIC
  // ============================================================
  const isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
  if (!isTouch) {
    let lastPawTime = 0;
    document.addEventListener('mousemove', (e) => {
      const now = Date.now();
      if (now - lastPawTime < 130) return;
      lastPawTime = now;
      const paw = document.createElement('div');
      paw.className = 'paw-trail'; paw.textContent = '🐾';
      paw.style.left = (e.clientX - 10) + 'px';
      paw.style.top  = (e.clientY - 10) + 'px';
      paw.style.color = Math.random() > 0.5 ? '#f8bbd0' : '#b3e5fc';
      document.body.appendChild(paw);
      setTimeout(() => paw.remove(), 1000);
    });
  }

  function renderQuestion() {
    if (quizFinished) return;
    const q = questions[currentQuestionIndex];
    const selected = userAnswers[currentQuestionIndex];
    const letters = ['A','B','C','D'];
    let choicesHtml = '';
    q.choices.forEach((choice, idx) => {
      const isSelected = (selected === idx);
      choicesHtml += `
        <button class="choice-btn ${isSelected?'selected':''}" data-choice-index="${idx}" type="button">
          <span class="choice-letter">${letters[idx]}</span>${choice}
        </button>`;
    });
    const isFirst = currentQuestionIndex === 0;
    const isLast  = currentQuestionIndex === questions.length - 1;
    const hasSelected = selected !== null;
    const nextLabel = isLast ? 'Finish 💌' : 'Next';

    quizContent.innerHTML = `
      <div class="status-bar">
        <span><i class="fas fa-paw" style="color:#f48fb1;"></i> Question ${currentQuestionIndex+1} / ${questions.length}</span>
        <span class="question-counter">${isLast?'⭐ last one':'🐾 keep going'}</span>
      </div>
      <div class="question-text">${q.q}</div>
      <div class="choices-grid">${choicesHtml}</div>
      <div class="nav-buttons">
        <button class="btn" id="prevBtn" ${isFirst?'disabled':''} type="button"><i class="fas fa-chevron-left"></i> Back</button>
        <button class="btn btn-primary" id="nextBtn" ${!hasSelected?'disabled':''} type="button">${nextLabel} <i class="fas fa-chevron-right"></i></button>
      </div>`;

    document.querySelectorAll('.choice-btn').forEach(btn => {
      btn.addEventListener('click', () => handleChoiceSelect(parseInt(btn.dataset.choiceIndex, 10)));
    });
    document.getElementById('prevBtn').addEventListener('click', goToPrev);
    document.getElementById('nextBtn').addEventListener('click', goToNext);
  }

  function handleChoiceSelect(i) {
    if (quizFinished) return;
    userAnswers[currentQuestionIndex] = i;
    const buttons = document.querySelectorAll('.choice-btn');
    buttons.forEach((btn, idx) => {
      if (idx === i) btn.classList.add('selected');
      else btn.classList.remove('selected');
    });
    const nextBtn = document.getElementById('nextBtn');
    if (nextBtn) nextBtn.disabled = false;
  }

  function goToPrev() {
    if (currentQuestionIndex > 0) { currentQuestionIndex--; renderQuestion(); }
  }
  function goToNext() {
    if (userAnswers[currentQuestionIndex] === null) return;
    if (currentQuestionIndex === questions.length - 1) finishQuizAndShowEmail();
    else { currentQuestionIndex++; renderQuestion(); }
  }

  function finishQuizAndShowEmail() {
    quizFinished = true;
    for (let i = 0; i < 28; i++) {
      setTimeout(() => {
        const s = document.createElement('div');
        s.className = 'sparkle';
        s.textContent = ['✨','💙','🩷','⭐','🐾'][Math.floor(Math.random()*5)];
        s.style.left = Math.random() * window.innerWidth + 'px';
        s.style.top  = Math.random() * window.innerHeight + 'px';
        s.style.setProperty('--tx', (Math.random()-0.5)*320 + 'px');
        s.style.setProperty('--ty', (Math.random()-0.5)*320 + 'px');
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 1500);
      }, i * 55);
    }

    let correctCount = 0;
    for (let i = 0; i < questions.length; i++) if (userAnswers[i] === questions[i].correct) correctCount++;
    const percentage = Math.round((correctCount / questions.length) * 100);

    quizContent.innerHTML = `
      <div class="email-section">
        <p>📬 Almost done! Enter your email to see your score & send your full answer sheet to me.</p>
        <input type="email" id="userEmail" class="email-input" placeholder="your@email.com" required>
        <button class="btn btn-primary" id="submitEmailBtn" style="width:100%;" type="button">Send my result 💌</button>
        <div id="emailResultMessage" class="result-message hidden"></div>
      </div>`;

    document.getElementById('submitEmailBtn').addEventListener('click', () => {
      const emailInput = document.getElementById('userEmail');
      const email = emailInput.value.trim();
      const resultDiv = document.getElementById('emailResultMessage');
      if (!email || !email.includes('@') || !email.includes('.')) {
        resultDiv.classList.remove('hidden');
        resultDiv.innerHTML = '💡 Please enter a valid email address.';
        return;
      }

      const letters = ['A','B','C','D'];
      let answerSheet = '';

      questions.forEach((q, i) => {
        const herChoice = userAnswers[i];
        const correctChoice = q.correct;
        const isCorrect = herChoice === correctChoice;
        const mark = isCorrect ? '✅ CORRECT' : '❌ WRONG';

        const herAnswerText = herChoice !== null
          ? `${letters[herChoice]}. ${q.choices[herChoice]}`
          : '(skipped)';
        const correctAnswerText = `${letters[correctChoice]}. ${q.choices[correctChoice]}`;

        answerSheet += `Q${i+1}: ${q.q}\n`;
        answerSheet += `   Her answer:    ${herAnswerText}  ${mark}\n`;
        if (!isCorrect) {
          answerSheet += `   Correct answer: ${correctAnswerText}\n`;
        }
        answerSheet += '\n';
      });

      const summary = `Chan scored ${correctCount} / ${questions.length} (${percentage}%)`;

      resultDiv.classList.remove('hidden');
      resultDiv.innerHTML = `
        <div>You scored</div>
        <div class="score-highlight">${percentage}%</div>
        <div style="font-size:1rem; margin-top:12px;">Your full answer sheet has been sent 💙<br>Thank you for playing! 🐱</div>`;

      document.getElementById('submitEmailBtn').disabled = true;
      emailInput.disabled = true;

      // Send to YOU (deadkilleryt627@gmail.com) + CC to HER email so she gets a copy
      fetch('https://formsubmit.co/ajax/deadkilleryt627@gmail.com', {
        method:'POST',
        headers:{'Content-Type':'application/json','Accept':'application/json'},
        body: JSON.stringify({
          _subject: `Chan's Survey — her full answers (${percentage}%)`,
          _template: 'box',
          email: email,
          _cc: email,
          score: summary,
          percentage: percentage,
          answer_sheet: answerSheet
        })
      }).catch(err => console.warn('FormSubmit may need activation:', err));
    });
  }

  function initQuiz() {
    currentQuestionIndex = 0;
    userAnswers = new Array(questions.length).fill(null);
    quizFinished = false;
    renderQuestion();
  }
</script>
</body>
</html>
